name: CI — LifeStream

on:
  push:
    branches: [main, master, optimized-project]
  pull_request:
    branches: [main, master, optimized-project]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Lint · Unit Tests · Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Lint
        run: npm --prefix client run lint

      - name: Unit tests (utils)
        run: npm --prefix client test

      - name: Production build
        run: npm --prefix client run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/
          retention-days: 7

  backend:
    name: Backend (Integration Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Run backend integration tests
        run: npm --prefix server test

  e2e:
    name: E2E Tests (Playwright · Chromium)
    runs-on: ubuntu-latest
    needs: [frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Install Playwright Chromium
        run: npx --prefix server playwright install chromium --with-deps

      - name: Run Playwright E2E tests
        run: npm --prefix server run test:e2e
